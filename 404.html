<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 · Token not in vocabulary · Guneesh Vats</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05060a">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); }
    .nf__code { font: 700 clamp(6rem, 22vw, 12rem)/.9 var(--font-display); letter-spacing: -.06em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf__msg { margin-top: 18px; font: 500 clamp(1.2rem, 3vw, 1.6rem)/1.3 var(--font-display); }
    .nf__log { margin: 22px auto 30px; max-width: 460px; text-align: left; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border); background: rgba(3, 4, 8, .7); font: 400 .8rem/1.8 var(--font-mono); color: var(--text-3); }
    .nf__log b { color: var(--pink); font-weight: 500; }
    .nf__log i { color: var(--green); font-style: normal; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf__code">404</p>
      <p class="nf__msg">This token isn't in the vocabulary.</p>
      <div class="nf__log">
        &gt; tokenizer.encode(<span data-path>"/…"</span>)<br>
        <b>KeyError:</b> &lt;unk&gt;: page not found<br>
        &gt; fallback → <i>"/"</i>
      </div>
      <a class="btn btn--primary btn--lg" href="/">Back to the homepage</a>
    </div>
  </main>
  <script>document.querySelector('[data-path]').textContent = JSON.stringify(location.pathname)</script>
</body>
</html>
